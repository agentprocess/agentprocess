<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">An announcement checked before the editor signs off</title>
  <desc id="desc">An agent promises CSV and PDF export to everyone. The check finds that PDF has not shipped and CSV is for administrators only, and sends the draft back. The corrected draft waits for the editor. Feedback travels to another agent; uncertain work goes to a person; the reviewer can see the work and the check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0e5e59"/></marker>
  </defs>
  <rect width="1120" height="640" rx="22" fill="#f7f6f2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#0e5e59" font-size="13" font-weight="700" letter-spacing="2">EXAMPLE · A CUSTOMER ANNOUNCEMENT</text>
    <text x="40" y="91" fill="#1c1d1a" font-size="30" font-weight="700">Catch a wrong promise before someone signs it off.</text>
    <text x="40" y="126" fill="#5b5e56" font-size="18">The agent writes. A check compares the draft with the facts. The editor decides.</text>

    <g stroke="#0e5e59" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M360 277H398"/><path d="M720 277H758"/></g>
    <rect x="40" y="180" width="320" height="200" rx="14" fill="#fff" stroke="#deded5"/>
    <rect x="400" y="180" width="320" height="200" rx="14" fill="#fff8e9" stroke="#ddc49b"/>
    <rect x="760" y="180" width="320" height="200" rx="14" fill="#e8efea" stroke="#c5d9cf"/>

    <text x="62" y="213" fill="#5b5e56" font-size="13" font-weight="700" letter-spacing="1">1 · THE FIRST DRAFT</text>
    <text x="62" y="251" fill="#1c1d1a" font-size="22" font-weight="650">“Everyone can now</text>
    <text x="62" y="280" fill="#1c1d1a" font-size="22" font-weight="650">export CSV and PDF.”</text>
    <text x="62" y="326" fill="#5b5e56" font-size="16">The draft promises more</text>
    <text x="62" y="350" fill="#5b5e56" font-size="16">than the product provides.</text>

    <text x="422" y="213" fill="#86601f" font-size="13" font-weight="700" letter-spacing="1">2 · SENT BACK TO FIX</text>
    <text x="422" y="251" fill="#1c1d1a" font-size="22" font-weight="650">PDF has not shipped.</text>
    <text x="422" y="283" fill="#715326" font-size="17">CSV is for administrators only.</text>
    <text x="422" y="326" fill="#715326" font-size="16">The feedback stays with the work.</text>
    <text x="422" y="350" fill="#715326" font-size="16">The revised draft is checked again.</text>

    <text x="782" y="213" fill="#0e5e59" font-size="13" font-weight="700" letter-spacing="1">3 · READY FOR THE EDITOR</text>
    <text x="782" y="251" fill="#1c1d1a" font-size="22" font-weight="650">“Administrators can</text>
    <text x="782" y="280" fill="#1c1d1a" font-size="22" font-weight="650">now export CSV.”</text>
    <text x="782" y="326" fill="#355950" font-size="16">The corrected draft waits.</text>
    <text x="782" y="350" fill="#355950" font-size="16">Only the editor can approve it.</text>

    <line x1="40" y1="420" x2="1080" y2="420" stroke="#deded5"/>
    <g fill="#1c1d1a" font-size="18" font-weight="650">
      <text x="40" y="459">Another agent takes over?</text>
      <text x="400" y="459">The facts are missing?</text>
      <text x="760" y="459">The editor needs context?</text>
    </g>
    <g fill="#5b5e56" font-size="16">
      <text x="40" y="491">It gets the previous feedback</text>
      <text x="40" y="515">with the work it picks up.</text>
      <text x="400" y="491">An uncertain check holds the draft</text>
      <text x="400" y="515">for a person to resolve.</text>
      <text x="760" y="491">The submitted work and check</text>
      <text x="760" y="515">result are in the same record.</text>
    </g>
    <text x="40" y="579" fill="#0e5e59" font-size="17" font-weight="650">Work can move between agents. Sign-off stays with the assigned person.</text>
    <text x="40" y="612" fill="#5b5e56" font-size="14">Illustrative sequence from a scripted test. AI checks can miss mistakes; this process still requires the editor's approval.</text>
  </g>
</svg>
