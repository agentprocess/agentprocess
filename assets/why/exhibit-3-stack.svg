<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" width="800" height="472" role="img" aria-labelledby="t3" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t3">Exhibit 3: Open standards now cover tools and know-how; the process layer is missing</title>
<rect x="0.5" y="0.5" width="799" height="471" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="32" y="40" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start" letter-spacing="1.4">EXHIBIT 3</text>
<text x="32" y="68" font-size="19" font-weight="600" fill="#1C1D1A" text-anchor="start">Open standards now cover tools and know-how; the process layer is missing</text>
<text x="32" y="92" font-size="13" font-weight="400" fill="#53564E" text-anchor="start">The layers an agent relies on, and the question each answers</text>
<line x1="32" y1="110" x2="768" y2="110" stroke="#E4E1D8"/>
<g transform="translate(0,124)"><text x="32" y="6" font-size="10.5" font-weight="600" fill="#8F8C83" text-anchor="start" letter-spacing="1.2">LAYER</text>
<text x="200" y="6" font-size="10.5" font-weight="600" fill="#8F8C83" text-anchor="start" letter-spacing="1.2">ANSWERS</text>
<text x="585" y="6" font-size="10.5" font-weight="600" fill="#8F8C83" text-anchor="start" letter-spacing="1.2">STANDARD</text>
<rect x="32" y="18" width="736" height="48" rx="8" fill="#FAF9F6" stroke="#E4E1D8"/>
<text x="48" y="47" font-size="14.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Organization</text>
<text x="200" y="47" font-size="12.5" font-weight="400" fill="#53564E" text-anchor="start">Who is accountable; which policy applies</text>
<text x="585" y="47" font-size="12.5" font-weight="400" fill="#1C1D1A" text-anchor="start">People, roles, policy</text>
<rect x="32" y="76" width="736" height="48" rx="8" fill="#0E5E59" stroke="#0E5E59"/>
<text x="48" y="105" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Process</text>
<text x="200" y="105" font-size="12.5" font-weight="400" fill="#D5ECE8" text-anchor="start">Next step, who decides, what is done, the record</text>
<text x="585" y="105" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Agent Process · open protocol</text>
<rect x="32" y="134" width="736" height="48" rx="8" fill="#E6F0EE" stroke="#C9E3DE"/>
<text x="48" y="163" font-size="14.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Know-how</text>
<text x="200" y="163" font-size="12.5" font-weight="400" fill="#53564E" text-anchor="start">How is this kind of task done well?</text>
<text x="585" y="163" font-size="12.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Agent Skills · open, 2025</text>
<rect x="32" y="192" width="736" height="48" rx="8" fill="#E6F0EE" stroke="#C9E3DE"/>
<text x="48" y="221" font-size="14.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Tools and context</text>
<text x="200" y="221" font-size="12.5" font-weight="400" fill="#53564E" text-anchor="start">How does the agent reach systems and data?</text>
<text x="585" y="221" font-size="12.5" font-weight="600" fill="#1C1D1A" text-anchor="start">MCP · open, 2024</text>
<rect x="32" y="250" width="736" height="48" rx="8" fill="#FAF9F6" stroke="#E4E1D8"/>
<text x="48" y="279" font-size="14.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Model</text>
<text x="200" y="279" font-size="12.5" font-weight="400" fill="#53564E" text-anchor="start">Can it reason and act?</text>
<text x="585" y="279" font-size="12.5" font-weight="400" fill="#1C1D1A" text-anchor="start">Any vendor</text></g>
<line x1="32" y1="428" x2="768" y2="428" stroke="#E4E1D8"/>
<text x="32" y="450" font-size="11" font-weight="400" fill="#8F8C83" text-anchor="start">Source: Agent Process analysis; Linux Foundation (MCP), agentskills.io.</text>
