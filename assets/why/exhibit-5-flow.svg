<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-labelledby="t5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t5">Exhibit 5: From a file to a finished, recorded run</title>
<rect x="0.5" y="0.5" width="799" height="411" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="32" y="40" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start" letter-spacing="1.4">EXHIBIT 5</text>
<text x="32" y="68" font-size="19" font-weight="600" fill="#1C1D1A" text-anchor="start">From a file to a finished, recorded run</text>
<text x="32" y="92" font-size="13" font-weight="400" fill="#53564E" text-anchor="start">How a process moves through a conforming server</text>
<line x1="32" y1="110" x2="768" y2="110" stroke="#E4E1D8"/>
<g transform="translate(0,124)"><rect x="32" y="6" width="162" height="150" rx="10" fill="#FAF9F6" stroke="#E4E1D8"/>
<text x="48" y="30" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start">01</text>
<text x="48" y="54" font-size="17" font-weight="600" fill="#1C1D1A" text-anchor="start">Write</text>
<text x="48" y="80" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">One PROCESS.md:</text>
<text x="48" y="98" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">inputs, steps, fields,</text>
<text x="48" y="116" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">evidence, plain-language</text>
<text x="48" y="134" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">instructions</text>
<path d="M198 81 h16" stroke="#8F8C83" stroke-width="1.5"/><path d="M214 76 l6 5 -6 5" fill="none" stroke="#8F8C83" stroke-width="1.5"/>
<rect x="218" y="6" width="162" height="150" rx="10" fill="#FAF9F6" stroke="#E4E1D8"/>
<text x="234" y="30" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start">02</text>
<text x="234" y="54" font-size="17" font-weight="600" fill="#1C1D1A" text-anchor="start">Publish</text>
<text x="234" y="80" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Checked by the server.</text>
<text x="234" y="98" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Roles mapped to groups.</text>
<text x="234" y="116" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Numbered version with</text>
<text x="234" y="134" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">a content hash</text>
<path d="M384 81 h16" stroke="#8F8C83" stroke-width="1.5"/><path d="M400 76 l6 5 -6 5" fill="none" stroke="#8F8C83" stroke-width="1.5"/>
<rect x="404" y="6" width="162" height="150" rx="10" fill="#0E5E59" stroke="#0E5E59"/>
<text x="420" y="30" font-size="11" font-weight="600" fill="#BFE3DC" text-anchor="start">03</text>
<text x="420" y="54" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Work</text>
<text x="420" y="80" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">Agents claim and submit</text>
<text x="420" y="98" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">over MCP. People get</text>
<text x="420" y="116" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">work items and decide.</text>
<text x="420" y="134" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">Stuck agents escalate.</text>
<path d="M570 81 h16" stroke="#8F8C83" stroke-width="1.5"/><path d="M586 76 l6 5 -6 5" fill="none" stroke="#8F8C83" stroke-width="1.5"/>
<rect x="590" y="6" width="162" height="150" rx="10" fill="#FAF9F6" stroke="#E4E1D8"/>
<text x="606" y="30" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start">04</text>
<text x="606" y="54" font-size="17" font-weight="600" fill="#1C1D1A" text-anchor="start">Record</text>
<text x="606" y="80" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Who, when, output,</text>
<text x="606" y="98" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">evidence and summary</text>
<text x="606" y="116" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">for every step. Rework</text>
<text x="606" y="134" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">kept in history.</text>
<rect x="32" y="176" width="736" height="56" rx="10" fill="#E6F0EE" stroke="#C9E3DE"/>
<text x="48" y="199" font-size="10.5" font-weight="700" fill="#0E5E59" text-anchor="start" letter-spacing="1.2">THE SERVER ENFORCES FIVE THINGS</text>
<text x="48" y="220" font-size="14" font-weight="600" fill="#1C1D1A" text-anchor="start">Order  ·  One actor at a time  ·  Acceptance  ·  People decide  ·  Immutability</text></g>
<line x1="32" y1="368" x2="768" y2="368" stroke="#E4E1D8"/>
<text x="32" y="390" font-size="11" font-weight="400" fill="#8F8C83" text-anchor="start">Source: Agent Process specification, core-2.</text>
</svg>
