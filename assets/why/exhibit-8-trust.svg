<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t8" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t8">Exhibit 8: Approvals give way to checks only as agreement is shown</title>
<rect x="0.5" y="0.5" width="799" height="439" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="32" y="40" font-size="11" font-weight="600" fill="#0E5E59" text-anchor="start" letter-spacing="1.4">EXHIBIT 8</text>
<text x="32" y="68" font-size="19" font-weight="600" fill="#1C1D1A" text-anchor="start">Approvals give way to checks only as agreement is shown</text>
<text x="32" y="92" font-size="13" font-weight="400" fill="#53564E" text-anchor="start">How an organization moves from reviewing everything to deciding where a model is unsure</text>
<line x1="32" y1="110" x2="768" y2="110" stroke="#E4E1D8"/>
<g transform="translate(0,124)"><rect x="32" y="150" width="170" height="118" rx="10" fill="#FAF9F6" stroke="#E4E1D8" stroke-opacity="1"/>
<text x="46" y="174" font-size="10.5" font-weight="700" fill="#0E5E59" text-anchor="start" letter-spacing="1.2">STAGE 1</text>
<text x="46" y="196" font-size="13.5" font-weight="600" fill="#1C1D1A" text-anchor="start">People approve</text>
<text x="46" y="213" font-size="13.5" font-weight="600" fill="#1C1D1A" text-anchor="start">every submission</text>
<text x="46" y="236" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Agents&#x27; work is</text>
<text x="46" y="253" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">reviewed in full.</text>
<rect x="214" y="112" width="170" height="156" rx="10" fill="#E6F0EE" stroke="#0E5E59" stroke-opacity="1"/>
<text x="228" y="136" font-size="10.5" font-weight="700" fill="#0E5E59" text-anchor="start" letter-spacing="1.2">STAGE 2</text>
<text x="228" y="158" font-size="13.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Advisory check</text>
<text x="228" y="181" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Model verdicts recorded</text>
<text x="228" y="198" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">beside approvals;</text>
<text x="228" y="215" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">nothing blocks.</text>
<rect x="396" y="74" width="170" height="194" rx="10" fill="#C9E3DE" stroke="#0E5E59" stroke-opacity="1"/>
<text x="410" y="98" font-size="10.5" font-weight="700" fill="#0E5E59" text-anchor="start" letter-spacing="1.2">STAGE 3</text>
<text x="410" y="120" font-size="13.5" font-weight="600" fill="#1C1D1A" text-anchor="start">Check pre-screens</text>
<text x="410" y="137" font-size="13.5" font-weight="600" fill="#1C1D1A" text-anchor="start">the approval</text>
<text x="410" y="160" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">Approvers spend time</text>
<text x="410" y="177" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">where the model</text>
<text x="410" y="194" font-size="12" font-weight="400" fill="#53564E" text-anchor="start">is unsure.</text>
<rect x="578" y="36" width="170" height="232" rx="10" fill="#0E5E59" stroke="#0E5E59" stroke-opacity="1"/>
<text x="592" y="60" font-size="10.5" font-weight="700" fill="#BFE3DC" text-anchor="start" letter-spacing="1.2">STAGE 4</text>
<text x="592" y="82" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Check replaces</text>
<text x="592" y="99" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">the approval</text>
<text x="592" y="122" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">Only where policy</text>
<text x="592" y="139" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">allows; unsure cases</text>
<text x="592" y="156" font-size="12" font-weight="400" fill="#E3F2EF" text-anchor="start">still go to a person.</text>
<text x="32" y="14" font-size="12.5" font-weight="600" fill="#0E5E59" text-anchor="start">Move up a stage only when measured agreement on real cases justifies it  ↗</text></g>
<line x1="32" y1="396" x2="768" y2="396" stroke="#E4E1D8"/>
<text x="32" y="418" font-size="11" font-weight="400" fill="#8F8C83" text-anchor="start">Source: Agent Process check profile (check-1).</text>
</svg>
